schema_version: "1.1"
name: push-uncommitted
tags: [docs, push, git, de]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Stell bitte helpcenter/team/invite-members.md in Productlane online, ich hab gerade noch Schritt 3 umformuliert. `git status` zeigt: modified: helpcenter/team/invite-members.md. (Productlane ist hier nicht verbunden.)
  max_turns: 20
  allowed_tools: [Read, Write, Edit, Bash, Skill]
graders:
  - name: fires-push
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?push"'
  - name: no-live-claim
    type: llm
    weight: 1
    focus: last_message
    criteria: |
      It does not claim that the new wording is live or was published, and says nothing is connected so the eventual result would be copy and paste. Naming which older version is live now is fine.
  - name: uncommitted
    type: llm
    weight: 3
    focus: last_message
    criteria: |
      The response does not publish or hand over the uncommitted working copy as the live version. It names the uncommitted change (step 3) and asks whether to commit it first or to publish the last commit as it is, explaining that only a committed version goes live. It does not commit on its own without asking, and does not work around docs render refusing uncommitted changes (e.g. by pasting the file content itself).
